# Релиз в Docker Hub. Запускается вручную (Actions -> Release -> Run workflow):
# выбираешь, какую часть версии поднять, всё остальное делает пайплайн —
# правит версию в файлах, ставит git-тег, собирает обе архитектуры и
# публикует. Ручной запуск, а не «на каждый пуш», выбран сознательно:
# релиз — это решение, а не побочный эффект коммита. Свежий образ с main
# и так доступен всегда: CI не публикует, но edge-тег ставит job publish-edge.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Какую часть версии поднять"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      dry_run:
        description: "Собрать и проверить, но не публиковать"
        type: boolean
        default: false

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'vvpreo/up-and-run-stt' }}

jobs:
  # ---------------------------------------------------------------- версия
  version:
    runs-on: ubuntu-latest
    # Джоб коммитит бамп версии и пушит тег — без этого права GITHUB_TOKEN
    # может оказаться read-only (зависит от настроек репозитория) и push
    # упадёт. В dry_run эти шаги пропускаются, поэтому холостой прогон
    # такую поломку не поймал бы.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      created: ${{ steps.bump.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version in pyproject.toml and src/__init__.py
        id: bump
        run: |
          python - <<'PY'
          import os, re, pathlib

          bump = os.environ["BUMP"]
          pp = pathlib.Path("pyproject.toml")
          init = pathlib.Path("src/__init__.py")

          cur = re.search(r'^version = "([^"]+)"', pp.read_text(), re.M).group(1)
          major, minor, patch = (int(x) for x in cur.split("."))
          if bump == "major":   major, minor, patch = major + 1, 0, 0
          elif bump == "minor": minor, patch = minor + 1, 0
          else:                 patch += 1
          new = f"{major}.{minor}.{patch}"

          # Две точки правды для версии — pyproject (сборка) и src/__init__
          # (то, что сервис отдаёт в /health). Поднимаем обе разом, чтобы
          # они не разъезжались.
          pp.write_text(re.sub(r'^version = "[^"]+"', f'version = "{new}"',
                               pp.read_text(), count=1, flags=re.M))
          init.write_text(re.sub(r'^__version__ = "[^"]+"', f'__version__ = "{new}"',
                                 init.read_text(), count=1, flags=re.M))
          # uv.lock тоже хранит версию проекта; иначе он отстаёт от pyproject
          # (после v2.1.0 в локе оставалось 2.0.1) и `uv sync` при следующей
          # правке зависимостей переписывает его лишним диффом.
          lock = pathlib.Path("uv.lock")
          lock.write_text(re.sub(r'(name = "up-and-run-stt"\nversion = )"[^"]+"',
                                 rf'\1"{new}"', lock.read_text(), count=1))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new}\n")
          print(f"{cur} -> {new}")
          PY
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" \
                  -m "Release v${{ steps.bump.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags

  # ---------------------------------------------------------------- сборка
  # Каждая архитектура собирается на своём нативном раннере и пушится
  # БЕЗ тега, по дайджесту; в один multi-arch тег их сшивает job merge.
  # Три варианта образа из одного репозитория Docker Hub (см. Dockerfile.cuda):
  #   cpu    — Dockerfile,      теги X.Y.Z / X.Y / X / latest,  amd64 + arm64
  #   cuda12 — Dockerfile.cuda, теги X.Y.Z-cuda12 / ... / cuda12, amd64
  #            (CUDA 12.8: GPU от Pascal, драйвер 525+; aarch64-сборок ORT под
  #            CUDA 12 нет, старые GeForce живут на x86)
  #   cuda13 — Dockerfile.cuda, теги X.Y.Z-cuda13 / ... / cuda13, amd64 + arm64
  #            (CUDA 13.0: GPU от Turing, драйвер 580+, DGX Spark)
  # Короткого алиаса `cuda` нет намеренно: выбор версии CUDA определяется
  # железом и драйвером, и его должен сделать тот, кто ставит образ.
  # GPU на раннерах нет, поэтому здесь CUDA-образы только собираются; CI гоняет
  # их тесты в CPU-режиме, проверка на реальной GPU — ручная (docs/SPARK.md).
  build:
    needs: version
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            arch: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile
            build_args: ""
          - variant: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
            build_args: ""
          - variant: cuda12
            arch: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile.cuda
            build_args: |
              CUDA_IMAGE=nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
              ORT_GPU_VERSION=1.29.0
              ORT_INDEX_URL=https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/
          - variant: cuda13
            arch: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile.cuda
            build_args: ""
          - variant: cuda13
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.cuda
            build_args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.version.outputs.created }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.variant }}
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.variant }}/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.variant }}/${{ matrix.arch }}
          retention-days: 1

  # ------------------------------------------------- сшивка и публикация
  merge:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      # Артефакты digest-<variant>-<arch> раскладываются по каталогам вариантов
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/cpu
          pattern: digest-cpu-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/cuda12
          pattern: digest-cuda12-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/cuda13
          pattern: digest-cuda13-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # X.Y.Z — точная версия; X.Y и X — «последняя в линейке», чтобы можно
      # было закрепиться на минорной ветке; latest — последний стабильный.
      # CUDA-варианты — те же теги с суффиксом -cuda12 / -cuda13 и плавающие
      # `cuda12` / `cuda13`. Алиаса `cuda` нет (см. комментарий к job build).
      - name: Create multi-arch manifests
        run: |
          V="${{ needs.version.outputs.version }}"
          MAJOR="${V%%.*}"; MINOR="${V%.*}"
          publish() {  # publish <variant-dir> <suffix> <floating-tag>
            local srcs=""
            for f in /tmp/digests/$1/*; do
              srcs="$srcs ${{ env.IMAGE }}@$(cat "$f")"
            done
            docker buildx imagetools create \
              -t "${{ env.IMAGE }}:$V$2" \
              -t "${{ env.IMAGE }}:$MINOR$2" \
              -t "${{ env.IMAGE }}:$MAJOR$2" \
              -t "${{ env.IMAGE }}:$3" \
              $srcs
            docker buildx imagetools inspect "${{ env.IMAGE }}:$V$2"
          }
          publish cpu    ""        latest
          publish cuda12 "-cuda12" cuda12
          publish cuda13 "-cuda13" cuda13

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --generate-notes сам находит предыдущий тег; явный
          # --notes-start-tag ломался бы на ПЕРВОМ релизе, когда
          # предыдущего тега ещё нет.
          V="${{ needs.version.outputs.version }}"
          gh release create "v$V" --title "v$V" --generate-notes

      # README на Docker Hub — та же страница, что и в репозитории.
      #
      # Идёт ПОСЛЕДНИМ и не валит релиз: к этому моменту образ уже
      # опубликован, и косметический синк описания не должен ронять джоб.
      # В релизе v2.0.1 он это и сделал — Docker Hub ответил на PATCH
      # Forbidden (Access Token без прав на правку метаданных репозитория),
      # из-за чего не создался GitHub Release, хотя образ уехал нормально.
      # Чтобы синк заработал, нужен токен со scope Read/Write/Delete;
      # иначе описание правится на Хабе руками, оно меняется редко.
      - name: Sync Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Local Russian speech-to-text (GigaAM, ONNX Runtime; CPU, CUDA 12 and CUDA 13 images) with an OpenAI-compatible API"

  # ------------------------------------------------------------ edge-образ
  # Не относится к релизу: отдельный воркфлоу держал бы дубль сборки, а так
  # ручной запуск с dry_run=true даёт проверку сборки без публикации.
  dry-run-build:
    needs: version
    if: ${{ inputs.dry_run }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            arch: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile
            build_args: ""
          - variant: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
            build_args: ""
          - variant: cuda12
            arch: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile.cuda
            build_args: |
              CUDA_IMAGE=nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
              ORT_GPU_VERSION=1.29.0
              ORT_INDEX_URL=https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/
          - variant: cuda13
            arch: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile.cuda
            build_args: ""
          - variant: cuda13
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.cuda
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build only
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
